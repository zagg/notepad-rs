[package]
name = "notepad-rs"
version = "1.0.0"
edition = "2021"
description = "Clone Rust de c:\\windows\\notepad.exe (stub) + editeur Notepad complet, sans application Store"

[[bin]]
name = "notepad"
path = "src/stub/main.rs"

[[bin]]
name = "notepad-rs"
path = "src/editor/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Com_Urlmon",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Recovery",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest = "1"

[profile.release]
opt-level = 2
lto = true
strip = true
